<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DrDer Chess Alpha - Local Chess Display">
    <meta name="theme-color" content="#1a1a1a">
    
    <title>DrDer ♟ chess</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="512.png">
    <link rel="apple-touch-icon" href="192.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div id="chessboard" class="chessboard"></div>
    </div>

    <!-- Scripts -->
    <script src="chess.min.js"></script>
    <script src="app.js"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(err => {
                console.warn('Service Worker registration failed:', err);
            });
        }
    </script>
</body>
</html>
