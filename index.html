<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DrDer Chess - AI vs AI Chess Display">
    <meta name="theme-color" content="#0a0a0a">
    
    <title>DrDer-CheSS</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="512.png">
    <link rel="apple-touch-icon" href="192.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- شاشة البداية -->
    <div id="startScreen" class="start-screen">
        <h1 class="start-title">DrDer-CheSS</h1>
        
        <button id="startBtn" class="start-btn">ابدأ</button>
        
        <div id="loadingMessage" class="loading-message" style="display: none;">
            <p class="loading-text">يتم تشغيل محركات الذكاء الاصطناعي...</p>
            <div class="loading-dots">
                <span class="dot-anim"></span>
                <span class="dot-anim"></span>
                <span class="dot-anim"></span>
            </div>
        </div>
        
        <div class="copyright">
            جميع الحقوق محفوظة © DrDer
        </div>
    </div>
    
    <!-- شاشة اللعب -->
    <div id="gameScreen" class="game-screen" style="display: none;">
        <h1 class="title">DrDer-CheSS</h1>
        
        <div class="players-bar">
            <div class="player-info">
                <span class="dot white-dot"></span>
                <span class="color-label">أبيض</span>
                <span id="whitePlayer" class="player-name">Alpha</span>
            </div>
            <div class="player-info">
                <span class="dot black-dot"></span>
                <span class="color-label">أسود</span>
                <span id="blackPlayer" class="player-name">Beta</span>
            </div>
        </div>
        
        <div class="board-wrapper">
            <div id="chessboard" class="chessboard"></div>
        </div>
        
        <div class="captured-area">
            <div class="captured-row">
                <span class="captured-player-name">Alpha</span>
                <span id="whiteCaptured" class="captured-pieces"></span>
            </div>
            <div class="captured-row">
                <span class="captured-player-name">Beta</span>
                <span id="blackCaptured" class="captured-pieces"></span>
            </div>
        </div>
        
        <div class="opening-display">
            <span id="openingName" class="opening-name"></span>
        </div>
        
        <button id="toggleSound" class="sound-btn">🔊</button>
    </div>

    <!-- شاشة الانتقال بين المباريات -->
    <div id="matchTransition" class="match-transition" style="display: none;">
        <p class="transition-text">المباراة القادمة تبدأ خلال</p>
        <p id="countdownNumber" class="countdown-number">5</p>
    </div>

    <script src="chess.min.js"></script>
    <script src="app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(err) {
                console.warn('SW registration failed:', err);
            });
        }
    </script>
</body>
</html>
