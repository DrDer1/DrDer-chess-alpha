<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="DrDer Chess - AI vs AI Chess Display">
    <meta name="theme-color" content="#0a0a0a">
    
    <title>DrDer-CheSS</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="512.png">
    <link rel="apple-touch-icon" href="192.png">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="title">DrDer-CheSS</h1>
    
    <div class="players-info">
        <div class="player-row">
            <span class="player-dot white-dot"></span>
            <span id="whitePlayer" class="player-name">Alpha</span>
        </div>
        <div class="captured-row">
            <span class="captured-label">أسرى الأبيض:</span>
            <span id="whiteCaptured" class="captured-pieces"></span>
        </div>
        <div class="player-row">
            <span class="player-dot black-dot"></span>
            <span id="blackPlayer" class="player-name">Beta</span>
        </div>
        <div class="captured-row">
            <span class="captured-label">أسرى الأسود:</span>
            <span id="blackCaptured" class="captured-pieces"></span>
        </div>
    </div>
    
    <div class="board-wrapper">
        <div id="chessboard" class="chessboard"></div>
    </div>

    <script src="chess.min.js"></script>
    <script src="app.js"></script>
    
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js').catch(function(err) {
                console.warn('SW registration failed:', err);
            });
        }
    </script>
</body>
</html>
